spring.application.name=ms-autenticacion
server.port=8086

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autenticacion_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs

usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8081}
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
