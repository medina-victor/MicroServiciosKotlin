spring.application.name=ms-autenticacion
server.port=8086

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autenticacion_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs

usuarios.service.url=${USUARIOS_SERVICE_URL:http://ms-usuarios}
services.internal-token=${INTERNAL_SERVICE_TOKEN:}
services.connect-timeout-ms=${SERVICE_CONNECT_TIMEOUT_MS:2000}
services.read-timeout-ms=${SERVICE_READ_TIMEOUT_MS:3000}
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
spring.cloud.loadbalancer.retry.enabled=false
